[project]
name = "deck"
version = "0.1.0"
description = "Personal Cyberdeck"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.13"
dependencies = [
    "ansible-core>=2.20.2",
    "cairosvg>=2.8.2",
    "jupyter>=1.1.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1",
    "mkdocs-obsidian-bridge>=1.3.1",
    "numpy>=2.4.4",
    "obsidian-callouts>=0.3.0",
    "pandas>=3.0.2",
    "pillow>=12.1.0",
    "plotly>=6.6.0",
    "rich>=14.3.3",
]

[dependency-groups]
dev = [
    "ansible-lint>=26.1.1",
    "mypy>=1.19.1",
    "pylint>=4.0.4",
    "ruff>=0.15.0",
    "ty>=0.0.15",
    "yamllint>=1.38.0",
]

[tool.ruff]
line-length = 79
exclude = [".venv"]
include = ["*.py"]
fix = true
# Group violations by containing file.
target-version = "py313"
output-format = "grouped"

[tool.ruff.lint]
select = [
    "I",    # isort
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "ICN",  # flake8-import-conventions
    "RET",  # flake8-return
    "UP",   # pyupgrade
    "FURB", # refurb
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
cache_dir = ".mypy_cache"
disable_error_code = ["import-untyped"]
